name: verify and deploy

# The parity suite gates the deploy. The browser engine is a port of the Python
# one, and the only thing keeping the two in step is that comparison — so if it
# fails, nothing ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Parity — JS port vs Python original
        run: python web/tools/parity/run_all.py

  deploy:
    needs: parity
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage the site
        # Only what the page actually needs. The parity harnesses under
        # web/tools/ are development tooling and depend on fixtures that are
        # deliberately not committed, so publishing them would ship a set of
        # pages that can only 404.
        run: |
          mkdir -p _site
          cp web/index.html web/app.js _site/
          cp -r web/src _site/
          cp -r web/vendor _site/
          touch _site/.nojekyll
          # The help panel offers this for download; if it is missing the link
          # 404s and the ODF Scan instructions dead-end.
          test -f _site/vendor/zotero-odf-scan-v3.2.1.xpi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
